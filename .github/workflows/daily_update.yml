name: Daily Turtle Strategy Update

on:
  schedule:
    # UTC 00:00 = 北京时间 8:00（周一至周五）
    - cron: '0 0 * * 1-5'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance matplotlib

      - name: Fetch data & run backtest
        run: |
          python scripts/daily_update.py
        continue-on-error: false

      - name: Build dashboard
        run: |
          mkdir -p dist
          cp src/index.html dist/
          cp -r src/css dist/ 2>/dev/null || true
          cp -r src/js dist/ 2>/dev/null || true
          # 确保 data 目录存在
          mkdir -p dist/data
          echo "Dashboard built successfully"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🤖 Auto-update turtle strategy [skip ci]'

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            await github.rest.issues.create({
              owner, repo,
              title: '⚠️ Turtle Dashboard 每日更新失败',
              body: `GitHub Actions 运行失败\n\n查看详情: ${runUrl}\n\n请检查数据源或脚本错误。`,
              labels: ['bug', 'automated']
            });
